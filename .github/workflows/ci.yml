name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node · syntax / version / selftest / smoke
    runs-on: ubuntu-latest
    env:
      SMOKE_PASSWORD: ci-Smoke-only-73x
    steps:
      - uses: actions/checkout@v4

      # 与 Dockerfile 的基础镜像保持同一主版本（node:sqlite 需要 Node 22.5+）
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: node --check
        run: |
          fail=0
          for f in $(git ls-files 'app/src/*.mjs' 'app/public/*.js' 'app/public/js/*.js'); do
            node --check "$f" || { echo "::error file=$f::语法错误"; fail=1; }
          done
          exit $fail

      # 版本号写在三处：package.json、server.mjs（页面与接口显示的版本）、docker-compose.yml（本地构建的镜像标签）
      - name: 版本号一致
        run: |
          pkg=$(node -p "require('./app/package.json').version")
          src=$(grep -oP "^const VERSION = '\K[^']+" app/src/server.mjs)
          compose=$(grep -oP 'tokentally:\K[0-9][^}"\s]*' docker-compose.yml | head -1)
          echo "package.json=$pkg server.mjs=$src docker-compose.yml=$compose"
          if [ "$pkg" != "$src" ] || [ "$pkg" != "$compose" ]; then
            echo "::error::版本号不一致：package.json=$pkg，server.mjs=$src，docker-compose.yml=$compose"
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      # 阿里云 ACS3 / 腾讯云 TC3 签名算法与 IP 归属地离线库自检（与镜像构建时执行的相同）
      - name: selftest
        working-directory: app
        run: node --disable-warning=ExperimentalWarning src/server.mjs --selftest

      # 以演示数据启动服务：健康检查、管理员登录、状态接口版本、分析数据接口
      - name: smoke
        run: |
          data=$(mktemp -d)
          DATA_DIR="$data" HOST=127.0.0.1 PORT=18080 DEMO_DATA=true ADMIN_USERNAME=admin ADMIN_PASSWORD="$SMOKE_PASSWORD" \
            node --disable-warning=ExperimentalWarning app/src/server.mjs > server.log 2>&1 &
          pid=$!
          set +e
          bash .github/scripts/smoke.sh http://127.0.0.1:18080 "$VERSION" "$SMOKE_PASSWORD"
          status=$?
          kill "$pid" 2>/dev/null
          if [ $status -ne 0 ]; then echo "---- 服务日志 ----"; cat server.log; fi
          exit $status
