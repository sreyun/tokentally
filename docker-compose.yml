# TokenTally · 大模型 API Key 费用分析（阿里云百炼 + 腾讯云 TokenHub）
#
# 直接 HTTP 访问：           docker compose up -d --build
# 自动 HTTPS（推荐对外）：   在 .env 设置 DOMAIN、BIND_ADDR=127.0.0.1、TRUST_PROXY=true 后
#                           docker compose --profile https up -d --build
services:
  app:
    build: .
    image: bailian-cost:1.3.0
    container_name: bailian-cost
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TZ: Asia/Shanghai
      # 演示模式：DEMO_DATA=true docker compose up -d 即可用虚构数据体验（配置真实访问密钥后自动清除）
      DEMO_DATA: ${DEMO_DATA:-false}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - bailian-data:/data
    # ---- 容器加固 ----
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777   # SQLite 备份（VACUUM INTO）排序时可能使用临时空间
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 可选：Caddy 反向代理，自动申请 Let's Encrypt 证书（需域名解析到本机且开放 80/443）
  caddy:
    image: caddy:2-alpine
    container_name: bailian-cost-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bailian-data:
  caddy-data:
  caddy-config:
